<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Agon{% endblock %}</title>
  <script src="/static/vendor/htmx.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; }
    nav { background: #1a2b45; color: #fff; padding: 0.6rem 1rem; display: flex; gap: 1rem; align-items: center; }
    nav a { color: #cfe0ff; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    nav .spacer { flex: 1; }
    main { padding: 1rem 1.25rem; max-width: 1000px; }
    table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: #f3f5f9; }
    .grade { font-size: 1.4rem; font-weight: 700; }
    .error { color: #b00020; }
    .muted { color: #666; }
    form.inline { display: inline; }
    input[type="number"] { width: 5rem; }
    pre.log { background: #0f1720; color: #d7e2f0; padding: 0.6rem; border-radius: 4px;
              max-height: 20rem; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .pros li { color: #0a6b2e; }
    .cons li { color: #8a1f1f; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  {% if current_user %}
  <nav>
    <a href="/ui/upload">Upload</a>
    <a href="/ui/reviews">History</a>
    {% if current_user.role.value == "ADMIN" %}
    <a href="/ui/admin/tests">Test config</a>
    <a href="/ui/admin/users">Users</a>
    {% endif %}
    <span class="spacer"></span>
    <span class="muted">{{ current_user.username }} ({{ current_user.role.value }})</span>
    <form class="inline" method="post" action="/logout">
      <button type="submit">Sign out</button>
    </form>
  </nav>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
