text: |
  the solution SHALL support deterministic atomic tests defined in a plugin
  whose evaluator applies a regular expression to a target file within the
  extracted source tree to compute a grade in the closed interval
  [0, grade_scale_maximum].
evaluation:
  type: deterministic
  method: unit_test
  success_criteria: |
    for a known source tree and a known regex, the evaluator reproducibly
    produces the expected grade in [0, grade_scale_maximum]
  failure_mode: assign zero grade and log regex compilation or execution error
  guardrails:
    - regex execution timeout 5s per file
    - target path validated against path traversal
    - regex engine capped to linear-time complexity where possible
  human_escalation: regex causes catastrophic backtracking (CPU > 100% for 5s)
