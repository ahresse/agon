text: |
  Solution SHALL require that every atomic test defined in a plugin
  specifies a unique identifier, a human-readable name, a test type, a target
  path within the extracted source tree, an execution strategy, and a weight.
evaluation:
  type: deterministic
  method: unit_test
  success_criteria: |
    plugin loader rejects an atomic test missing any mandatory attribute and
    reports the missing field in a structured error
  failure_mode: skip the malformed atomic test and continue loading other definitions
  guardrails: mandatory attribute list is versioned with the plugin schema
  human_escalation: never
