text: |
  the solution SHALL support agent-based atomic tests defined in a plugin that
  invoke an external AI Agent to analyze the extracted source tree and produce a
  grade in the closed interval [0, grade_scale_maximum] with textual reasoning.
evaluation:
  type: probabilistic
  method: model_inference_with_temperature
  success_criteria: |
    grade is a number in [0, grade_scale_maximum] with ≤ 2 decimal places;
    reasoning text is non-empty and ≥ 20 characters
  failure_mode: escalate to human review; do not persist grade
  guardrails:
    - temperature: 0.3
    - max_tokens: 4096
    - network egress blocked for the inference call
    - AI Agent context size capped at 128 KiB per excerpt
  human_escalation: |
    grade < 5 or grade > 18, reasoning missing, or grade variance > 4 points
    across 3 independent runs
