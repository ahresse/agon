text: |
  the solution SHALL support deterministic atomic tests defined in a plugin that
  execute a Python script inside the LXD container and compute a grade in the
  closed interval [0, grade_scale_maximum] from the script's exit code, stdout,
  and stderr.
evaluation:
  type: deterministic
  method: exit_code_assertion
  success_criteria: |
    script exit code, stdout, and stderr are captured and mapped to a grade
    in [0, grade_scale_maximum] using the evaluator configured in the plugin
  failure_mode: assign zero grade and log script execution error
  guardrails:
    - script execution timeout 300s
    - script path validated against path traversal
    - network egress blocked by default for the script execution
  human_escalation: script execution timeout exceeds 300s or exits with uncaught exception
